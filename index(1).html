<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thesis Monitor</title>
<meta name="theme-color" content="#1F4E5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thesis">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F6; --surface:#FFFFFF; --ink:#16213A; --muted:#5E6675; --rule:#DCE1E4;
  --petrol:#1F4E5F; --petrol-ink:#FFFFFF; --petrol-soft:#E4EEF0;
  --sup:#2F7D4F; --mon:#A86B12; --cha:#B42318; --ins:#8C929B;
  --sup-bg:#E7F2EB; --mon-bg:#F7EEDD; --cha-bg:#F9E4E2; --ins-bg:#EEF0F2;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1622; --surface:#172131; --ink:#E6EAF0; --muted:#9AA3B2; --rule:#2A3647;
    --petrol:#5FA3B8; --petrol-ink:#0B1520; --petrol-soft:#1C3440;
    --sup:#5DBB84; --mon:#E0A748; --cha:#F07A6E; --ins:#9AA0A8;
    --sup-bg:#16301F; --mon-bg:#33270F; --cha-bg:#3A1A17; --ins-bg:#222B37;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1622; --surface:#172131; --ink:#E6EAF0; --muted:#9AA3B2; --rule:#2A3647;
  --petrol:#5FA3B8; --petrol-ink:#0B1520; --petrol-soft:#1C3440;
  --sup:#5DBB84; --mon:#E0A748; --cha:#F07A6E; --ins:#9AA0A8;
  --sup-bg:#16301F; --mon-bg:#33270F; --cha-bg:#3A1A17; --ins-bg:#222B37;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--petrol)}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;max-width:720px;margin:0 auto}
.brand{font-weight:600;letter-spacing:-.01em;font-size:17px;display:flex;align-items:center;gap:8px}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--petrol);display:grid;place-items:center}
.brand-mark::after{content:"";width:8px;height:8px;border:2px solid var(--petrol-ink);border-radius:50%}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px;color:var(--muted);cursor:pointer}
.iconbtn:active{background:var(--rule)}
h1{font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:8px 0 4px;font-weight:600}
h2{font-size:19px;line-height:1.3;margin:28px 0 10px;font-weight:600;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 4px;font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.serif{font-family:var(--serif);font-size:18px;line-height:1.6}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px;margin:0 0 12px}
.card.tight{padding:12px 14px}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--rule);margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);min-height:44px}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:var(--petrol-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btn.small{min-height:36px;padding:7px 12px;font-size:14px}
.big-action{width:100%;background:var(--petrol);color:var(--petrol-ink);border:0;border-radius:16px;padding:18px 20px;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px}
.big-action .t{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.big-action .s{font-size:14px;opacity:.85;margin-top:2px}
.big-action:disabled{opacity:.7}
label.f{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
input.i,textarea.i,select.i{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:11px 12px;font-size:16px}
textarea.i{min-height:120px;resize:vertical;line-height:1.5}
textarea.serif-in{font-family:var(--serif);font-size:18px}
input.i:focus,textarea.i:focus,select.i:focus{outline:2px solid var(--petrol);outline-offset:1px;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > div{min-width:0}
/* status marks: shape + colour */
.st{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap}
.mk{width:11px;height:11px;flex:none;display:inline-block}
.st.supported{background:var(--sup-bg);color:var(--sup)} .mk.supported{background:var(--sup);border-radius:50%}
.st.monitor{background:var(--mon-bg);color:var(--mon)} .mk.monitor{border-radius:50%;background:linear-gradient(90deg,var(--mon) 50%,transparent 50%);border:1.5px solid var(--mon)}
.st.challenged{background:var(--cha-bg);color:var(--cha)} .mk.challenged{background:var(--cha);transform:rotate(45deg) scale(.82);border-radius:1px}
.st.insufficient{background:var(--ins-bg);color:var(--ins)} .mk.insufficient{border:2px solid var(--ins);border-radius:50%}
.tag{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--ins-bg);color:var(--muted);font-weight:500}
.tag.pos{background:var(--sup-bg);color:var(--sup)} .tag.neg{background:var(--cha-bg);color:var(--cha)} .tag.neu{background:var(--petrol-soft);color:var(--petrol)}
.brief{font-family:var(--serif);font-size:22px;line-height:1.45;margin:6px 0 18px;letter-spacing:-.005em}
.hold{display:block;text-decoration:none;color:inherit}
.hold .tk{font-weight:600;font-size:17px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kv div{min-width:0}
.kv .k{font-size:12.5px;color:var(--muted)}
.kv .v{font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.pos-t{color:var(--sup)} .neg-t{color:var(--cha)}
.pillar{border-left:3px solid var(--rule);padding:2px 0 2px 12px;margin:14px 0}
.pillar.supported{border-color:var(--sup)} .pillar.monitor{border-color:var(--mon)} .pillar.challenged{border-color:var(--cha)} .pillar.insufficient{border-color:var(--ins)}
.quote{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:16px;line-height:1.5;margin:4px 0}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.split{display:grid;gap:10px;margin:10px 0}
.split .lab{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.said{background:var(--paper);border-radius:10px;padding:10px 12px}
.ai{background:var(--petrol-soft);border-radius:10px;padding:10px 12px}
.ev{font-size:13.5px;color:var(--muted);margin:6px 0 0;padding-left:0;list-style:none}
.ev li{padding:3px 0}
.ev li::before{content:"↳ ";color:var(--petrol)}
ul.watch{margin:6px 0 0;padding-left:18px;font-size:14.5px}
.bb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bb > div{border-radius:10px;padding:10px 12px;min-width:0}
.bb .bull{background:var(--sup-bg)} .bb .bear{background:var(--cha-bg)}
.scen{display:grid;gap:10px}
.scen .sc{border:1px solid var(--rule);border-radius:12px;padding:12px}
.strip{position:relative;height:44px;margin:14px 4px 4px}
.strip .ax{position:absolute;left:0;right:0;top:20px;height:2px;background:var(--rule)}
.strip .rg{position:absolute;top:14px;height:14px;border-radius:4px;opacity:.85}
.strip .now{position:absolute;top:4px;bottom:4px;width:2px;background:var(--ink)}
.strip .nowl{position:absolute;top:-14px;font-size:11.5px;transform:translateX(-50%);white-space:nowrap}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 16px 22px}
.tl li::before{content:"";position:absolute;left:5px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--petrol)}
.tl li::after{content:"";position:absolute;left:8.5px;top:18px;bottom:0;width:1px;background:var(--rule)}
.tl li:last-child::after{display:none}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.bottom .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:11.5px;color:var(--muted);text-decoration:none;position:relative}
nav.bottom a.on{color:var(--petrol);font-weight:600}
nav.bottom svg{width:22px;height:22px}
.dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--cha);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:19;border-radius:999px;box-shadow:0 6px 20px rgba(22,33,58,.22)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.progress{display:flex;gap:10px;align-items:center;padding:14px;border-radius:12px;background:var(--petrol-soft);color:var(--petrol);font-size:14.5px;margin:10px 0}
.err{background:var(--cha-bg);color:var(--cha);border-radius:12px;padding:12px 14px;font-size:14.5px;margin:10px 0}
.note{background:var(--mon-bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0}
.empty{text-align:center;padding:36px 12px}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.msg.u{align-self:flex-end;background:var(--petrol);color:var(--petrol-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--rule);border-bottom-left-radius:4px}
.composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--paper);padding:8px 0}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:14.5px;margin-bottom:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.bar{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;margin-top:4px}
.bar > i{display:block;height:100%;background:var(--petrol)}
.searchbar{display:flex;gap:8px}
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--sup) 0%,var(--sup) 33%,var(--petrol) 33%,var(--petrol) 66%,var(--cha) 66%);opacity:.85;margin:22px 2px 6px}
.meter .pin{position:absolute;top:-6px;width:4px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.meter .pl{position:absolute;top:-22px;font-size:11.5px;transform:translateX(-50%);white-space:nowrap;font-weight:600}
.mlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.sig{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:14.5px}
.sig:first-of-type{border-top:0}
.lean{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:2px 0}
.lean.pos{color:var(--sup)} .lean.neg{color:var(--cha)} .lean.mix{color:var(--mon)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
.facts div{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--rule);font-size:14.5px;gap:8px}
.facts div span:first-child{color:var(--muted)}
@media (min-width:560px){ .facts{grid-template-columns:repeat(3,1fr)} }
.footer-note{font-size:12.5px;color:var(--muted);margin-top:30px;text-align:center}
.unread{border-left:3px solid var(--petrol)}
@media (min-width:560px){ .split{grid-template-columns:1fr 1fr} .scen{grid-template-columns:repeat(3,1fr)} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Thesis Monitor</div>
  <a class="iconbtn" href="#/settings" aria-label="Settings">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </a>
</header>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>
<nav class="bottom" aria-label="Main"><div class="in" id="nav"></div></nav>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const STATUS = {
  supported:{label:"Supported", say:"Recent evidence is consistent with this part of your thesis."},
  monitor:{label:"Needs monitoring", say:"Evidence is mixed or early. Worth watching."},
  challenged:{label:"Potentially challenged", say:"Recent evidence cuts against this part of your thesis."},
  insufficient:{label:"Insufficient evidence", say:"Not enough reliable information yet to judge."}
};
const STATUS_KEYS = Object.keys(STATUS);
const RULES = `Rules you must follow:
- Never tell the user to buy, sell, hold, add or trim. Never give a price target or a recommendation.
- Never give numeric scores or probabilities.
- Pillar statuses may only be: supported, monitor, challenged, insufficient.
- Keep what the company said separate from your own interpretation.
- Only use facts from (a) the material the user pasted, (b) web search results if you have the web search tool, or (c) your own background knowledge. Label every piece of evidence with its source (publication or document name) and date. For background knowledge, use source "AI background knowledge" with the approximate period; it may be outdated. Prefer the most recent reliable sources: company filings, results releases, earnings calls, exchange announcements, and established financial news.
- Never invent figures, dates or quotes. If you do not have reliable information, say so and use status "insufficient".
- Plain English. No hype.`;

/* ---------- state ---------- */
const LS_KEY = "tm_state_v1";
let state = blank();

let saveTimer = null, busy = {};
function blank(){ return {v:1, currency:"₹", stocks:[], alerts:[], journal:[], searches:[]}; }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function now(){ return new Date().toISOString(); }
function lsGet(){ try{ const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function lsSet(s){ try{ localStorage.setItem(LS_KEY, JSON.stringify(trimForSave(s))); }catch(e){} }

function trimForSave(s){
  const c = JSON.parse(JSON.stringify(s));
  c.stocks.forEach(st=>{ if(st.chat && st.chat.length>30) st.chat = st.chat.slice(-30); if(st.reviews && st.reviews.length>15) st.reviews = st.reviews.slice(-15); if(st.news && st.news.length>40) st.news = st.news.slice(-40); });
  if(c.alerts.length>100) c.alerts = c.alerts.slice(-100);
  if(c.searches && c.searches.length>12) c.searches = c.searches.slice(-12);
  return c;
}
function save(){
  lsSet(state);

}

/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n){ if(n==null||isNaN(n)) return "—"; const c = state.currency; const loc = c==="₹" ? "en-IN" : "en-US"; return c + Number(n).toLocaleString(loc,{maximumFractionDigits: Math.abs(n)<100?2:0}); }
function pct(n){ if(n==null||isNaN(n)) return "—"; return (n>0?"+":"") + n.toFixed(1) + "%"; }
function dfmt(iso){ if(!iso) return "—"; const d = new Date(iso); if(isNaN(d)) return esc(iso); return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }
function ago(iso){ if(!iso) return "never"; const s = (Date.now()-new Date(iso))/1000; if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+" min ago"; if(s<86400) return Math.floor(s/3600)+" h ago"; const d=Math.floor(s/86400); return d===1?"yesterday":d+" days ago"; }
function mark(k){ k = STATUS[k]?k:"insufficient"; return `<span class="st ${k}"><span class="mk ${k}" aria-hidden="true"></span>${STATUS[k].label}</span>`; }
function stockById(id){ return state.stocks.find(s=>s.id===id); }
function curThesis(s){ return s.theses[s.theses.length-1]; }
function lastOf(a){ return a && a.length ? a[a.length-1] : null; }
function md(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }

function thesisStatus(s){
  const c = {supported:0,monitor:0,challenged:0,insufficient:0};
  s.pillars.forEach(p=>c[p.status in c ? p.status : "insufficient"]++);
  let k = "insufficient";
  if(c.challenged) k = "challenged"; else if(c.monitor) k = "monitor"; else if(c.supported) k = "supported";
  const parts = [];
  if(c.supported) parts.push(c.supported+" supported");
  if(c.monitor) parts.push(c.monitor+" to monitor");
  if(c.challenged) parts.push(c.challenged+" challenged");
  if(c.insufficient) parts.push(c.insufficient+" without enough evidence");
  return {k, text: parts.join(", "), c};
}

/* ---------- AI providers: Gemini (free tier) or Claude (paid) ---------- */
const KEY_LS="tm_api_key", GKEY_LS="tm_gemini_key", CFG_LS="tm_cfg";
const CFG_DEFAULT = {provider:"gemini", model:"claude-sonnet-5", quick:"claude-haiku-4-5-20251001", gmodel:"gemini-2.5-flash", gquick:"gemini-2.5-flash-lite", web:true};
function cfg(){ try{ return Object.assign({}, CFG_DEFAULT, JSON.parse(localStorage.getItem(CFG_LS)||"{}")); }catch(e){ return Object.assign({}, CFG_DEFAULT); } }
function setCfg(c){ try{ localStorage.setItem(CFG_LS, JSON.stringify(c)); }catch(e){} }
function keyFor(p){ try{ return localStorage.getItem(p==="claude"?KEY_LS:GKEY_LS)||""; }catch(e){ return ""; } }
function apiKey(){ return keyFor(cfg().provider); }
function errText(e){
  const c = e && e.code;
  if(c==="no_key") return "Add your free Gemini API key in Settings (gear icon, top right) to use the AI features.";
  if(c==="auth") return "Your API key was rejected. Check it in Settings.";
  if(c==="credit") return "Your AI account is out of credit or over its limit.";
  if(c==="quota") return "You've reached the free daily limit for this AI model. Try again later, or pick a lighter model (Flash-Lite) in Settings.";
  if(c==="model") return "That AI model isn't available. Pick a different model in Settings.";
  if(c==="blocked") return "The AI declined to answer this one. Try rewording it.";
  if(c==="rate_limited") return "Too many requests at once. Wait a minute and try again.";
  if(c==="overloaded") return "The AI is busy right now. Try again in a minute.";
  if(c==="invalid_json") return "The AI's answer came back in the wrong shape. Please try again.";
  if(c==="network") return "No internet connection, or the request was blocked. Check your connection and try again.";
  if(c==="cancelled") return "Stopped.";

const SYSTEM = "You are Thesis Monitor, a careful equity research assistant. You help an investor track whether their own investment thesis still holds. You never give buy, sell or hold recommendations, never give price targets, and never give numeric scores.";
async function claudeCall(messages, opt){

    if(res.status===401||res.status===403) throw {code:"auth", message:msg};
    if(res.status===429) throw {code:"rate_limited", message:msg};
    if(res.status===529||res.status===503) throw {code:"overloaded", message:msg};
    if(/credit|balance|billing/i.test(msg)) throw {code:"credit", message:msg};

  }

  let buf="", text="", blockStart=true;

      const line = buf.slice(0,i).trim(); buf = buf.slice(i+1);
      if(!line.startsWith("data:")) continue;

async function callClaude(messages, opt){ return cfg().provider==="claude" ? claudeCall(messages, opt) : geminiCall(messages, opt); }

function parseJSON(t){
  const s = t.replace(/```json|```/g,"");
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if(a<0||b<a) throw {code:"invalid_json"};
  try{ return JSON.parse(s.slice(a,b+1)); }catch(e){ throw {code:"invalid_json"}; }
}
async function askJSON(prompt, tier, opt){

  return parseJSON(t);
}

async function extractPillars(s, text){
  const prompt = `An investor wrote down why they own ${s.name||s.ticker} (${s.ticker}). Break their reasoning into its thesis pillars: the separate things that must stay true for the thesis to hold.
Do not add ideas they did not express. Do not judge the thesis. Keep their meaning exactly.

THEIR WORDS:
"""${text}"""

Reply with only JSON in this shape:
{"company_name": "official company name if you recognise the ticker, else empty string",
 "sector": "short sector name, e.g. IT services, Banking, Pharma; empty if unsure",
 "exchange": "e.g. NSE, NYSE, NASDAQ; empty if unsure",
 "pillars": [{"title": "3-7 word name", "quote": "the exact phrase from their words this pillar comes from, copied verbatim", "watch": ["2-3 specific, measurable things to monitor, e.g. 'Quarterly revenue growth vs 15%'"]}]}
Between 2 and 6 pillars.`;
  const out = await askJSON(prompt, "default", {max:2000});
  const ps = Array.isArray(out && out.pillars) ? out.pillars : [];
  if(!ps.length) throw {code:"invalid_json"};
  s.pillars = ps.slice(0,6).map(p=>({id:"p"+uid().slice(0,5), title:String(p.title||"Pillar"), quote: text.includes(p.quote)?p.quote:String(p.quote||""), watch:(p.watch||[]).map(String).slice(0,4), status:"insufficient", reason:"Not reviewed yet. Press What changed? to check it against recent information.", updated:now()}));
  if(!s.name && out.company_name) s.name = String(out.company_name);
  if(out.sector) s.sector = String(out.sector);
  if(out.exchange) s.exchange = String(out.exchange);
}

async function runWhatChanged(s, pasted){
  const key = "wc"+s.id; busy[key]=true;
  $("#wcgo").disabled = true;
  $("#wcmsg").innerHTML = `<div class="progress"><span class="spin"></span>Searching for recent results and news, then checking each pillar. This can take 1–2 minutes.</div>`;
  const last = lastOf(s.reviews);
  const prompt = `You are a careful equity research assistant. Review what has changed for this investor's thesis${last?" since their last review on "+last.date.slice(0,10):""}.
${RULES}

${stockContext(s)}
${last?`\nPREVIOUS REVIEW SUMMARY: ${last.summary}`:""}

MATERIAL THE USER PASTED (source "User-provided material", dated today unless it states a date):
"""${pasted || "(nothing pasted)"}"""

Look at results, filings, earnings calls, news, guidance and market developments. For each pillar that has relevant evidence, write one finding. If a pillar has no reliable evidence, include a finding with new_status "insufficient" and say what information is missing.

Reply with only JSON:
{"summary": "2-3 factual sentences on what changed",
 "findings": [{"pillar_id": "one of the pillar ids above", "headline": "short factual headline", "company_statement": "what the company itself said or reported, or empty string", "ai_interpretation": "your interpretation of what it means for this pillar", "impact": "positive | negative | mixed | neutral", "new_status": "supported | monitor | challenged | insufficient", "status_reason": "one sentence explaining the status", "evidence": [{"source": "...", "date": "...", "detail": "the specific fact"}], "watch": ["1-3 measurable things to watch next"]}],
 "major_event": {"title": "the single most important development, or empty string if none", "bull_reading": "how an optimist reads it", "bear_reading": "how a sceptic reads it", "resolves": "what future information would settle it"},
 "data_note": "one sentence on data limits, e.g. that background knowledge may be out of date"}`;
  try{
    const out = await askJSON(prompt, "complex", {web:true, webUses:6, max:6000});
    const findings = (out.findings||[]).filter(f=>f && typeof f==="object").map(f=>({...f, new_status: STATUS[f.new_status]?f.new_status:"insufficient"}));
    const date = now();
    findings.forEach(f=>{
      const p = s.pillars.find(x=>x.id===f.pillar_id); if(!p) return;
      f.old_status = p.status;
      if(p.status!==f.new_status){
        state.alerts.push({id:uid(), stockId:s.id, date, read:false, title:`${s.ticker}: ${p.title} is now ${STATUS[f.new_status].label.toLowerCase()}`, body:`Was ${STATUS[p.status].label.toLowerCase()}. ${f.status_reason||""}`, evidence:(f.evidence||[]).map(e=>e.source+(e.date?", "+e.date:"")).join("; ")});
      }
      p.status = f.new_status; p.reason = f.status_reason||p.reason; p.updated = date;
      if(f.watch && f.watch.length) p.watch = f.watch.slice(0,4);
    });
    s.reviews.push({date, summary:String(out.summary||""), findings, major_event: out.major_event||null, data_note:String(out.data_note||""), pasted: !!pasted});
    save();
  }catch(e){
    busy[key]=false;
    const m = $("#wcmsg"); if(m){ m.innerHTML = `<div class="err">${esc(errText(e))}</div>`; const b=$("#wcgo"); if(b) b.disabled=false; }
    return;
  }
  busy[key]=false; rerender();
}

function outlookHTML(s, o){
  const prev = s.outlooks.length>1 ? s.outlooks[s.outlooks.length-2] : null;
  const sc = o.scenarios;
  let strip = "";
  if(sc && sc.ok){
    const vals = [sc.bear.low, sc.bull.high, s.price].filter(v=>v!=null);
    const mn = Math.min(...vals)*0.92, mx = Math.max(...vals)*1.05, X = v=>((v-mn)/(mx-mn)*100).toFixed(2)+"%";
    const band = (c,col)=>`<div class="rg" style="left:${X(c.low)};width:calc(${X(c.high)} - ${X(c.low)});background:${col}"></div>`;
    strip = `<div class="strip" aria-hidden="true"><div class="ax"></div>${band(sc.bear,"var(--cha)")}${band(sc.base,"var(--petrol)")}${band(sc.bull,"var(--sup)")}${s.price!=null?`<div class="now" style="left:${X(s.price)}"><span class="nowl">Now ${money(s.price)}</span></div>`:""}</div>`;
  }
  const scCard = (n,k)=>{ const c=o[k], r = sc&&sc.ok?sc[k]:null; return `<div class="sc"><div class="row between"><strong>${n}</strong></div>
    <p class="small" style="margin:6px 0">${esc(c&&c.narrative)}</p>
    ${r?`<div class="small"><strong>${money(r.low)} – ${money(r.high)}</strong></div><div class="tiny muted">EPS growth ${c.eps_growth_pct}%/yr for ${sc.years} yr, P/E ${c.pe_low}–${c.pe_high}. ${esc(c.basis||"")}</div>`:""}</div>`; };
  return `<div class="card">
    <div class="row between wrapflex"><strong>${esc(o.stance)}</strong><span class="tag neu">${esc(o.confidence)} confidence</span></div>
    <p class="small" style="margin:8px 0">${esc(o.summary)}</p>
    <p class="tiny muted">Why ${esc(o.confidence.toLowerCase())} confidence: ${esc(o.confidence_reason)}</p>
    ${o.change&&prev?`<div class="note"><strong>Changed from ${esc(prev.stance)} to ${esc(o.stance)}.</strong> ${esc(o.change)}</div>`:""}
    <div class="hr"></div>
    <h3>Scenarios</h3>
    ${sc&&sc.ok?strip:`<div class="note">${esc(sc&&sc.msg||"Insufficient data to produce a reliable scenario.")}</div>`}
    <div class="scen">${scCard("Bull","bull")}${scCard("Base","base")}${scCard("Bear","bear")}</div>
    ${sc&&sc.ok?`<p class="tiny muted" style="margin-top:8px">Range = trailing EPS ${sc.eps} × (1 + growth)<sup>${sc.years}</sup> × P/E. These are arithmetic on stated assumptions, not predictions.</p>`:""}
    ${o.drivers&&o.drivers.length?`<div class="hr"></div><div class="small muted">What it's based on</div><ul class="watch">${o.drivers.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`:""}
    ${o.monitor&&o.monitor.length?`<div class="small muted" style="margin-top:8px">What to monitor</div><ul class="watch">${o.monitor.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`:""}
    <p class="tiny muted" style="margin:10px 0 0">Generated ${dfmt(o.date)}${o.web?" with web search":o.pasted?"":" from the AI's background knowledge, which may be out of date"}.</p>
  </div>`;
}

async function runOutlook(s){
  const key="ol"+s.id; busy[key]=true;
  const btn=$("#ol"); btn.disabled=true;
  $("#olpanel").innerHTML = `<div class="progress"><span class="spin"></span>Building bull, base and bear cases…</div>`;
  const prev = lastOf(s.outlooks), r = lastOf(s.reviews);
  const years = /5\+/.test(s.horizon)?5 : /3–5/.test(s.horizon)?3 : /1–3/.test(s.horizon)?2 : 1;
  const prompt = `Produce a balanced outlook for this holding based on fundamentals, the macro backdrop and recent developments. Describe cases; do not predict.
${RULES}

${stockContext(s)}
${r?`\nLATEST REVIEW (${r.date.slice(0,10)}): ${r.summary}\n${(r.findings||[]).map(f=>"- "+f.headline+": "+f.ai_interpretation).join("\n")}`:""}
${prev?`\nPREVIOUS OUTLOOK (${prev.date.slice(0,10)}): stance ${prev.stance}, ${prev.confidence} confidence. ${prev.summary}`:""}

For each scenario you may give valuation assumptions (annual EPS growth % over the next ${years} year(s) and a P/E range) ONLY if you can justify them from evidence; otherwise set them to null. Do not calculate prices; the app does that.

Reply with only JSON:
{"stance": "Improving | Stable | Weakening | Unclear",
 "summary": "2-3 sentences",
 "confidence": "Low | Medium | High",
 "confidence_reason": "why that confidence level",
 "bull": {"narrative": "...", "eps_growth_pct": number|null, "pe_low": number|null, "pe_high": number|null, "basis": "evidence behind these assumptions"},
 "base": {same shape},
 "bear": {same shape},
 "drivers": ["2-4 facts the outlook is based on, each with source and date"],
 "monitor": ["2-4 measurable things that would change this outlook"],
 "change": ${prev?`"if the stance or confidence differs from the previous outlook, explain why and cite the evidence and affected pillars; else empty string"`:`""`}}`;
  try{
    const out = await askJSON(prompt, "complex", {web:true, webUses:4, max:5000});
    const conf = ["Low","Medium","High"].includes(out.confidence)?out.confidence:"Low";
    const o = {date:now(), stance:String(out.stance||"Unclear"), summary:String(out.summary||""), confidence:conf, confidence_reason:String(out.confidence_reason||""), bull:out.bull||{}, base:out.base||{}, bear:out.bear||{}, drivers:out.drivers||[], monitor:out.monitor||[], change:String(out.change||""), pasted: !!(r&&r.pasted), web: cfg().web};
    o.scenarios = computeScenarios(s, o, years);
    if(prev && prev.stance!==o.stance){
      state.alerts.push({id:uid(), stockId:s.id, date:o.date, read:false, title:`${s.ticker}: outlook changed from ${prev.stance} to ${o.stance}`, body:o.change||o.summary});
    } else if(prev && prev.scenarios && prev.scenarios.ok && o.scenarios.ok){
      const m1=(prev.scenarios.base.low+prev.scenarios.base.high)/2, m2=(o.scenarios.base.low+o.scenarios.base.high)/2;
      if(Math.abs(m2-m1)/m1>=0.10) state.alerts.push({id:uid(), stockId:s.id, date:o.date, read:false, title:`${s.ticker}: base scenario moved ${pct((m2-m1)/m1*100)}`, body:o.change||"The assumptions behind the base case changed."});
    }
    s.outlooks.push(o); save();
  }catch(e){
    busy[key]=false; const p=$("#olpanel"); if(p) p.innerHTML = `<div class="err">${esc(errText(e))}</div>`; const b=$("#ol"); if(b) b.disabled=false; return;
  }
  busy[key]=false; rerender();
}

function computeScenarios(s, o, years){
  if(s.eps==null || !(s.eps>0)) return {ok:false, msg:"Insufficient data to produce a reliable scenario. Add the trailing EPS (tap the price above) to see price ranges."};
  const res = {ok:true, eps:s.eps, years};
  for(const k of ["bear","base","bull"]){
    const c = o[k]||{};
    const g=Number(c.eps_growth_pct), lo=Number(c.pe_low), hi=Number(c.pe_high);
    if(c.eps_growth_pct==null||c.pe_low==null||c.pe_high==null||[g,lo,hi].some(isNaN)||lo<=0||hi<lo) return {ok:false, msg:"Insufficient data to produce a reliable scenario. The AI could not justify valuation assumptions from the available evidence."};
    const fe = s.eps*Math.pow(1+g/100, years);
    res[k] = {low: fe*lo, high: fe*hi};
  }
  return res;
}

function timelineHTML(s){
  const ev = [];
  s.theses.forEach(t=>ev.push({d:t.date, t: t.version===1?"Thesis created":"Thesis revised to version "+t.version, x: t.version===1?"":t.note}));
  s.reviews.forEach(r=>ev.push({d:r.date, t:"What Changed review", x:r.summary}));
  s.outlooks.forEach(o=>ev.push({d:o.date, t:"Outlook: "+o.stance+", "+o.confidence+" confidence", x:o.change}));
  state.journal.filter(j=>j.stockId===s.id).forEach(j=>ev.push({d:j.date, t:"Journal note (thesis v"+j.version+")", x:j.note}));

function money2(n, cur){
  if(n==null||isNaN(n)) return "—";
  const sym = {INR:"₹",USD:"$",EUR:"€",GBP:"£",JPY:"¥"}[String(cur||"").toUpperCase()] || (cur? cur+" " : state.currency);
  const loc = sym==="₹"?"en-IN":"en-US";
  return sym + Number(n).toLocaleString(loc,{maximumFractionDigits: Math.abs(n)<100?2:0});
}
function num(v){ const n = Number(v); return v==null||v===""||isNaN(n) ? null : n; }

/* Signals are computed here in code from the reported facts, so the logic is visible and consistent. */
function analyse(d){
  const p = num(d.price), eps = num(d.eps_ttm);
  const out = {signals:[], zone:null};
  // valuation zone
  const lo = num(d.pe_hist_low), md = num(d.pe_hist_median), hi = num(d.pe_hist_high);
  if(eps && eps>0 && lo && hi && hi>lo){
    const mid = md && md>lo && md<hi ? md : (lo+hi)/2;
    out.zone = {eps, lo, mid, hi, cheap:[eps*lo, eps*mid], fairTop: eps*hi};
    if(p!=null){
      const pe = p/eps;
      let t, s;
      if(pe<lo){ t=`Below its usual valuation (P/E ${pe.toFixed(1)} vs usual low ${lo})`; s=1; }
      else if(pe<mid){ t=`In the lower half of its usual valuation (P/E ${pe.toFixed(1)})`; s=1; }
      else if(pe<=hi){ t=`In the upper half of its usual valuation (P/E ${pe.toFixed(1)})`; s=0; }
      else { t=`Above its usual valuation (P/E ${pe.toFixed(1)} vs usual high ${hi})`; s=-1; }
      out.signals.push({k:"Valuation", t, s});
    }
  }
  // trend
  const d50 = num(d.dma_50), d200 = num(d.dma_200);
  if(p!=null && d50 && d200){
    if(p>d50 && p>d200) out.signals.push({k:"Trend", t:"Above both its 50- and 200-day averages (uptrend)", s:1});
    else if(p<d50 && p<d200) out.signals.push({k:"Trend", t:"Below both its 50- and 200-day averages (downtrend)", s:-1});
    else out.signals.push({k:"Trend", t:"Between its 50- and 200-day averages (mixed)", s:0});
  }
  // 52w position
  const h52 = num(d.high_52w), l52 = num(d.low_52w);
  if(p!=null && h52 && l52 && h52>l52){
    const pos = (p-l52)/(h52-l52)*100;
    out.pos52 = Math.max(0,Math.min(100,pos));
    out.signals.push({k:"52-week range", t:`${pos.toFixed(0)}% of the way from the 52-week low to the high`, s:0});
  }
  // analysts
  const a = d.analyst||{}; const tAvg = num(a.target_avg);
  if(p!=null && tAvg){
    const up = (tAvg-p)/p*100;
    out.signals.push({k:"Analyst targets", t:`Average target ${money2(tAvg,d.currency)}, ${up>=0?up.toFixed(0)+"% above":Math.abs(up).toFixed(0)+"% below"} today's price${a.count?" ("+a.count+" analysts)":""}`, s: up>10?1: up<-5?-1:0});
  }
  // growth
  const rg = num(d.revenue_growth_pct), pg = num(d.profit_growth_pct);
  if(rg!=null || pg!=null){
    const g = pg!=null?pg:rg;
    out.signals.push({k:"Growth", t:[rg!=null?`Revenue ${pct(rg)}`:"", pg!=null?`profit ${pct(pg)}`:""].filter(Boolean).join(", ")+(d.growth_period?` (${d.growth_period})`:""), s: g>10?1: g<0?-1:0});
  }
  // news tone
  const ns = (d.news||[]);
  if(ns.length){
    const sc = ns.reduce((x,n)=>x+(n.tone==="positive"?1:n.tone==="negative"?-1:0),0);
    out.signals.push({k:"News tone", t:`${ns.filter(n=>n.tone==="positive").length} positive, ${ns.filter(n=>n.tone==="negative").length} negative of ${ns.length} recent stories`, s: sc>=2?1: sc<=-2?-1:0});
  }
  const scored = out.signals.filter(x=>x.k!=="52-week range");
  const tot = scored.reduce((x,y)=>x+y.s,0);
  out.lean = scored.length<3 ? {label:"Not enough data", cls:""} : tot>=2 ? {label:"Signals lean positive", cls:"pos"} : tot<=-2 ? {label:"Signals lean negative", cls:"neg"} : {label:"Signals are mixed", cls:"mix"};
  out.count = {pos: scored.filter(x=>x.s>0).length, neg: scored.filter(x=>x.s<0).length, n: scored.length};
  return out;
}
function leanOf(r){ const l = analyse(r.data).lean; return {label: l.label.replace("Signals ",""), cls:l.cls}; }

function scenarioTrack(){
  const rows = [];
  state.stocks.forEach(s=>s.outlooks.forEach(o=>{ if(o.scenarios&&o.scenarios.ok) rows.push({s,o}); }));
  if(!rows.length) return "";
  return `<h2>Scenario track record</h2><div class="card"><p class="small muted">Where today's price sits against each stored base case. Past fit doesn't mean future accuracy.</p>
  ${rows.slice(-8).reverse().map(({s,o})=>{ const b=o.scenarios.base, p=s.price; let w="no current price"; if(p!=null){ w = p<o.scenarios.bear.low?"below the bear range": p<b.low?"below base, within bear side": p<=b.high?"inside the base range": p<=o.scenarios.bull.high?"above base, within bull side":"above the bull range"; } return `<div class="row between small" style="margin:10px 0"><span><strong>${esc(s.ticker)}</strong> <span class="muted">${dfmt(o.date)}</span></span><span>${w}</span></div>`; }).join("")}</div>`;
}

    const ch = $(".chips"); if(ch) ch.remove();
    const log = $("#log");
    log.insertAdjacentHTML("beforeend", `<div class="msg u">${esc(q)}</div><div class="msg a" id="live">Thinking…</div>`);
    window.scrollTo(0, document.body.scrollHeight);
    const r = lastOf(s.reviews), o = lastOf(s.outlooks);
    const ctx = `You are a research copilot for an investor who holds ${s.ticker}. Answer their questions clearly and briefly, in plain English.
${RULES}
- Say where each fact comes from (their thesis, their latest review, or your background knowledge with its approximate date).

${stockContext(s)}
${r?`LATEST REVIEW (${r.date.slice(0,10)}): ${r.summary}`:""}
${o?`LATEST OUTLOOK (${o.date.slice(0,10)}): ${o.stance}, ${o.confidence} confidence. ${o.summary}`:""}

QUESTION: `;
    const hist = s.chat.slice(-10).map(m=>({role:m.role, content:m.content}));
    const turns = hist.length ? [{role:"user", content: ctx + hist[0].content}, ...hist.slice(1), {role:"user", content:q}] : [{role:"user", content: ctx + q}];
    if(turns.length>1 && turns[1].role==="user"){ /* keep alternation valid */ }
    const live = $("#live");
    try{
      const text = await callClaude(turns, {max:2000, web:true, webUses:3, onText:({text})=>{ live.innerHTML = md(text); window.scrollTo(0, document.body.scrollHeight); }});
      live.innerHTML = md(text);
      s.chat.push({role:"user", content:q},{role:"assistant", content:text});
      save();
    }catch(e){
      live.innerHTML = `<span style="color:var(--cha)">${esc(errText(e))}</span>`;
    }
    live.removeAttribute("id");
    $("#send").disabled = false;
    window.scrollTo(0, document.body.scrollHeight);
  }
}

function vAlerts(app){
  const list = state.alerts.slice().reverse();
  app.innerHTML = `<h1>Alerts</h1>
  <p class="small muted">Only material changes: a pillar's status moving, or the outlook changing. News alone never triggers an alert.</p>
  ${list.length?list.map(a=>{ const s=stockById(a.stockId); return `<div class="card ${a.read?"":"unread"}"><div class="tiny muted">${dfmt(a.date)}</div><h3 style="margin-top:2px">${esc(a.title)}</h3><p class="small">${esc(a.body)}</p>${a.evidence?`<p class="tiny muted">Evidence: ${esc(a.evidence)}</p>`:""}<div class="row">${s?`<a class="btn small" href="#/stock/${s.id}">Open ${esc(s.ticker)}</a>`:""}${a.read?"":`<button class="btn ghost small" data-r="${a.id}">Mark as read</button>`}</div></div>`; }).join(""):`<div class="empty"><p class="muted">No alerts. You'll see one here when a review changes a pillar's status.</p></div>`}`;
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ const a=state.alerts.find(x=>x.id===b.dataset.r); a.read=true; save(); rerender(); });
}
